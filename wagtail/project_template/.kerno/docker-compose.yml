services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=wagtail_user"
      - "POSTGRES_PASSWORD=wagtail_password"
      - "POSTGRES_DB=wagtail_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U wagtail_user -d wagtail_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/wagtail_db?user=wagtail_user&password=wagtail_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8000/ || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
